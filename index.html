<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Aradesh — Калькулятор цены → AED</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aradesh">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#0f172a;
      --accent:#904D30;
      --accent-2:#B07052;
      --border:#e5e7eb;
      --danger:#ef4444;
      --input:#f8fafc;
      --shadow: 0 10px 30px rgba(17,24,39,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);}
    .wrap{max-width:920px;margin:32px auto;padding:0 20px;}
    header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
    .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;color:#fff;letter-spacing:.04em}
    h1{font-size:24px;margin:0}
    .brand{font-size:12px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .full{grid-column:1/-1}
    label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
    input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--text);outline:none}
    input::placeholder{color:#9aa3b2}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    button{padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:linear-gradient(180deg,#fafafa,#f0f2f5);color:var(--text);cursor:pointer}
    button.primary{background:linear-gradient(180deg,var(--accent),#7e442b);border-color:#7e442b;color:#fff}
    button:disabled{opacity:.6;cursor:not-allowed}
    .result{margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .tile{background:var(--input);border:1px solid var(--border);border-radius:14px;padding:16px}
    .tile .h{font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .tile .v{font-weight:800;font-size:24px}
    .muted{color:var(--muted)}
    .help{margin-top:10px;color:var(--muted);font-size:12px}
    .error{color:var(--danger);font-size:14px;margin-top:8px}
    .k-note{font-size:12px;color:var(--muted)}
    @media (max-width:720px){
      .grid{grid-template-columns:1fr}
      .result{grid-template-columns:1fr}
    }
    .foot{margin-top:18px;font-size:12px;color:var(--muted);}
    .accent{color:var(--accent);font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">A</div>
      <div>
        <h1>Калькулятор цены → AED</h1>
        <div class="brand">Aradesh</div>
        <div class="k-note">Вводи <b>курс AED→RUB</b> (сколько ₽ за 1 AED). Поля запоминаются.</div>
      </div>
    </header>

    <div class="card">
      <div class="grid">
        <div>
          <label>Цена закупа (₽)</label>
          <input id="priceRub" type="number" inputmode="decimal" placeholder="Напр. 1200" />
        </div>
        <div>
          <label>Вес (в граммах)</label>
          <input id="weightGr" type="number" inputmode="decimal" step="1" placeholder="Напр. 750" />
        </div>
        <div>
          <label>Курс AED→RUB (₽ за 1 AED)</label>
          <input id="rateAedRub" type="number" inputmode="decimal" step="0.0001" placeholder="Напр. 32.5" />
        </div>
        <div>
          <label>Категория (коэфф.)</label>
          <select id="category"></select>
        </div>
        <div class="full">
          <div class="row">
            <button class="primary" id="calcBtn">Рассчитать</button>
            <button id="clearBtn">Очистить</button>
            <div class="help">Логистика считается как <b>20 AED/кг</b>. При вводе веса в граммах логистика = <i>(граммы ÷ 1000) × 20</i>.</div>
          </div>
          <div class="error" id="error"></div>
        </div>
      </div>

      <div class="result" id="result">
        <div class="tile">
          <div class="h">Себестоимость</div>
          <div class="v" id="cost">—</div>
          <div class="muted" id="costMeta"></div>
        </div>
        <div class="tile">
          <div class="h">Цена</div>
          <div class="v" id="price">—</div>
          <div class="muted" id="priceMeta"></div>
        </div>
        <div class="tile">
          <div class="h">Маржа</div>
          <div class="v" id="margin">—</div>
          <div class="muted" id="marginMeta"></div>
        </div>
      </div>
      <div class="foot">Брендинг: <span class="accent">Aradesh</span></div>
    </div>
  </div>

  <script>
    // Категории и коэффициенты
    const coefficients = {
      "Полуфабрикаты домашние": 2.5,
      "Мясо домашнее": 1.9,
      "Молочка домашняя": 3.0,
      "Сыры домашние": 2.9,
      "Колбасы домашние": 2.3,
      "Соусы/специи домашние": 2.3,
      "Овощи/зелень домашние": 2.2,
      "Фрукты/ягоды домашние": 2.2,
      "Хлеб/зерновые домашние": 2.3,
      "Полуфабрикаты брендовые": 2.1,
      "Мясо брендовое": 1.8,
      "Молочка брендовая": 2.0,
      "Сыры брендовые": 2.1,
      "Колбасы брендовые": 2.1,
      "Соусы/специи брендовые": 2.0,
      "Овощи брендовые": 1.8,
      "Фрукты брендовые": 1.7,
      "Хлеб/зерновые брендовые": 2.0,
      "Напитки брендовые": 1.9
    };

    // UI refs
    const el = (id) => document.getElementById(id);
    const priceRub = el('priceRub');
    const weightGr = el('weightGr');
    const rateAedRub = el('rateAedRub');
    const category = el('category');
    const calcBtn = el('calcBtn');
    const clearBtn = el('clearBtn');
    const errorBox = el('error');
    const cost = el('cost');
    const costMeta = el('costMeta');
    const price = el('price');
    const priceMeta = el('priceMeta');
    const margin = el('margin');
    const marginMeta = el('marginMeta');

    // Fill categories
    (() => {
      for (const [name, k] of Object.entries(coefficients)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${name} — ${k}`;
        category.appendChild(opt);
      }
      category.value = localStorage.getItem('category') || "Полуфабрикаты домашние";
    })();

    // Load saved values
    [priceRub, weightGr, rateAedRub].forEach(inp => {
      const v = localStorage.getItem(inp.id);
      if (v !== null) inp.value = v;
      inp.addEventListener('input', () => localStorage.setItem(inp.id, inp.value));
    });
    category.addEventListener('change', () => localStorage.setItem('category', category.value));

    // Helpers
    const fmt = (n) => isFinite(n) ? `${Number(n).toFixed(2)} AED` : '—';
    const validate = () => {
      errorBox.textContent = '';
      if (!priceRub.value || !weightGr.value || !rateAedRub.value) {
        errorBox.textContent = '⚠️ Заполни все поля.'; return false;
      }
      const pr = parseFloat(priceRub.value);
      const g = parseFloat(weightGr.value);
      const r = parseFloat(rateAedRub.value);
      if ([pr,g,r].some(x => isNaN(x)) || r <= 0 || g < 0 || pr < 0) {
        errorBox.textContent = '⚠️ Проверь корректность значений.'; return false;
      }
      return true;
    };

    function calculate() {
      if (!validate()) return;
      const pr = parseFloat(priceRub.value);
      const g = parseFloat(weightGr.value);
      const r = parseFloat(rateAedRub.value);
      const k = coefficients[category.value];

      // ₽ → AED через курс AED→RUB (₽ за 1 AED)
      const purchaseAED = pr / r;
      const kg = g / 1000;
      const logisticsAED = kg * 20;
      const costAED = purchaseAED + logisticsAED;
      const priceAED = costAED * k;
      const marginAED = priceAED - costAED;
      const marginPct = priceAED ? (marginAED / priceAED) * 100 : 0;

      cost.textContent = fmt(costAED);
      price.textContent = fmt(priceAED);
      margin.textContent = fmt(marginAED);
      costMeta.textContent = `Закуп ${purchaseAED.toFixed(2)} + Логистика ${logisticsAED.toFixed(2)} (AED)`;
      priceMeta.textContent = `Коэфф. ${k} (${category.value})`;
      marginMeta.textContent = `≈ ${marginPct.toFixed(1)}% от цены`;
    }

    // Events
    calcBtn.addEventListener('click', calculate);
    clearBtn.addEventListener('click', () => {
      [priceRub, weightGr, rateAedRub].forEach(inp => { inp.value=''; localStorage.removeItem(inp.id); });
      errorBox.textContent='';
      [cost, price, margin].forEach(e => e.textContent='—');
      [costMeta, priceMeta, marginMeta].forEach(e => e.textContent='');
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });

    // Register service worker (for offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
